[project]
name = "raf"
version = "1.0.0"
description = "RAF: Rubric Auto-generation Framework — rubric generation and refinement platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "openai>=1.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.12",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
