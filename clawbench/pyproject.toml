[project]
name = "clawbench"
version = "1.0.0"
description = "ClawBench — Docker-based evaluation harness and 121-task benchmark for long-horizon LLM agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "requests>=2.31",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "claude-agent-sdk==0.2.98",
    "rarfile>=4.1",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "manual_scorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
